name: Daily market scan

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC Mon-Fri = 14:00 Riga (winter) = 07:00 New York, before the US open
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan (3 attempts, Yahoo sometimes rate-limits)
        run: |
          mkdir -p site
          for i in 1 2 3; do
            python market_scan.py --html site/index.html && break
            echo "Attempt $i failed, waiting 2 minutes"; sleep 120
          done
          test -f site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
